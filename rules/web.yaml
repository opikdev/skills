- id: WEB-SEO-001
  severity: error
  rule: Every page has exactly one h1
  why: Search engines and screen readers use it as the page topic
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-002
  severity: error
  rule: Every page has a unique title
  why: Titles are what search results show
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-003
  severity: error
  rule: Every page has a unique meta description
  why: Duplicates read as thin content and waste the search snippet
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-004
  severity: error
  rule: Every indexable page has a self-referencing canonical URL
  why: Prevents duplicate URLs competing with each other
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-005
  severity: error
  rule: The sitemap lists exactly the indexable pages
  why: Missing or stale entries waste crawling and hide pages
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-006
  severity: error
  rule: Internal links, images, and anchors resolve
  why: Broken links hurt visitors and crawlers
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-SEO-007
  severity: warn
  rule: Indexable pages have JSON-LD
  why: It earns rich results in Search, but Google does not require it for AI features
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-A11Y-001
  severity: error
  rule: No axe violations for WCAG 2.2 AA in light or dark mode
  why: Automated checks catch part of WCAG cheaply on every change
  applies: { type: web-app }
  verify: { tool: axe, command: pnpm check:a11y }
- id: WEB-SEC-001
  severity: warn
  rule: Response headers set CSP and HSTS
  why: CSP limits injected scripts, and HSTS may instead be set at the edge
  applies: { type: web-app }
  verify: { tool: check-site }
- id: WEB-LH-001
  severity: error
  rule: Lighthouse performance, accessibility, best practices, and SEO each score 0.95 or more on every page
  why: A broad regression signal across every category
  applies: { type: web-app }
  verify: { tool: lighthouse, audit: categories }
- id: WEB-PERF-001
  severity: error
  rule: Pages weigh 150 KB or less
  why: A hard budget stops slow growth that scores would hide
  applies: { type: web-app }
  verify: { tool: lighthouse, audit: total-byte-weight, max: 153600 }
- id: WEB-PERF-002
  severity: error
  rule: Largest Contentful Paint is 2.5s or less in the lab
  why: Field LCP can't be measured in CI, so this is the early proxy
  applies: { type: web-app }
  verify: { tool: lighthouse, audit: largest-contentful-paint, max: 2500 }
- id: WEB-PERF-003
  severity: error
  rule: Total Blocking Time is 200ms or less in the lab
  why: A page load has no interactions, so TBT stands in for INP
  applies: { type: web-app }
  verify: { tool: lighthouse, audit: total-blocking-time, max: 200 }
- id: WEB-PERF-004
  severity: warn
  rule: Field LCP, INP, and CLS meet Core Web Vitals at p75
  why: Real users are the true measure, but low-traffic sites may have no data
  applies: { type: web-app }
  verify: { tool: report-field-vitals }
- id: WEB-PERF-005
  severity: error
  rule: Cumulative Layout Shift is 0.1 or less in the lab
  why: Layout shift is measurable in a page load
  applies: { type: web-app }
  verify: { tool: lighthouse, audit: cumulative-layout-shift, max: 0.1 }
