- id: CODE-001
  severity: error
  rule: Files match the formatter
  why: Agents should not spend review attention on style
  applies: { type: any }
  verify: { tool: oxfmt, command: pnpm format:check }
- id: CODE-002
  severity: error
  rule: Lint passes with no warnings and no unused disable directives
  why: Warnings left in place stop being read
  applies: { type: any }
  verify: { tool: oxlint, command: pnpm lint }
- id: CODE-003
  severity: error
  rule: Type-check passes
  why: Types catch invented APIs before anything runs
  applies: { type: any }
  verify: { tool: astro check, command: pnpm check }
- id: CODE-004
  severity: error
  rule: Tests pass
  why: Done means proven
  applies: { type: any }
  verify: { tool: node test, command: pnpm test }
- id: CI-001
  severity: warn
  rule: GitHub Actions are pinned to a commit SHA
  why: Tags can move, which is a supply-chain risk
  applies: { type: any }
  verify: { tool: check-site }
